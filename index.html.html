<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carry Club · DROP #001 · Bath & Body Works</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Raleway:wght@100;200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#080808; --card:#141414; --card2:#1a1a1a;
    --border:#242424; --cyan:#88C8D8; --rose:#C86890;
    --white:#EDE9E2; --gray:#666; --lgray:#333;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--black);color:var(--white);font-family:"Raleway",sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;background:rgba(8,8,8,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
  .logo-img{height:44px;width:auto;object-fit:contain}
  .cart-btn{position:relative;background:var(--card2);border:1px solid var(--border);color:var(--white);padding:7px 14px;border-radius:20px;font-family:"Raleway",sans-serif;font-size:10px;font-weight:300;letter-spacing:2px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
  .cart-btn.has-items{border-color:var(--cyan);color:var(--cyan)}
  .cart-count{background:linear-gradient(135deg,var(--cyan),var(--rose));color:#080808;font-size:9px;font-weight:400;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center}
  .cart-count.visible{display:flex}

  /* HERO */
  .hero{padding:24px 20px 20px;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse at 50% 0%,rgba(136,200,216,0.05) 0%,transparent 70%)}
  .drop-badge{display:inline-block;background:linear-gradient(90deg,var(--cyan),var(--rose));color:#080808;font-size:8px;font-weight:400;letter-spacing:4px;padding:3px 14px;border-radius:20px;margin-bottom:14px}
  .bbw-logo-wrap{display:inline-flex;align-items:center;justify-content:center;background:#FF3D9A;border-radius:10px;padding:6px 10px;margin-bottom:8px}
  .bbw-logo-wrap img{height:38px;width:auto}
  .hero-sub{font-size:9px;font-weight:200;letter-spacing:3px;color:var(--gray);margin-bottom:14px}
  .deadline{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:9px;letter-spacing:2px;color:var(--gray)}
  .deadline span{background:linear-gradient(90deg,var(--cyan),var(--rose));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:400}

  /* FILTERS */
  .filters{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
  .filters::-webkit-scrollbar{display:none}
  .filter-tab{flex-shrink:0;padding:5px 12px;border-radius:16px;font-size:8px;letter-spacing:2px;font-weight:300;cursor:pointer;border:1px solid var(--border);color:var(--gray);background:transparent;transition:all .2s}
  .filter-tab.active{background:var(--card2);color:var(--white);border-color:var(--lgray)}
  .filter-tab[data-cat="BODY CARE"].active{border-color:var(--cyan);color:var(--cyan)}
  .filter-tab[data-cat="FRAGRANCE"].active{border-color:var(--rose);color:var(--rose)}
  .filter-tab[data-cat="HOME"].active{border-color:#C8D880;color:#C8D880}
  .filter-tab[data-cat="HAND CARE"].active{border-color:#D4A860;color:#D4A860}

  /* PRODUCTS */
  .products{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .product-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
  .product-card.in-cart{border-color:var(--cyan)}
  .product-card.hidden{display:none}
  .card-top-line{height:2px;background:linear-gradient(90deg,var(--cyan),var(--rose));opacity:0;transition:opacity .2s}
  .product-card.in-cart .card-top-line{opacity:1}
  .card-img{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card2);position:relative}
  .card-img svg{width:48px;height:48px;opacity:0.45}
  .cat-pill{position:absolute;top:7px;left:7px;font-size:6px;letter-spacing:1.5px;padding:2px 7px;border-radius:10px;font-weight:400;background:rgba(8,8,8,0.75);backdrop-filter:blur(4px)}
  .cat-pill.body{color:var(--cyan);border:1px solid rgba(136,200,216,0.3)}
  .cat-pill.frag{color:var(--rose);border:1px solid rgba(200,104,144,0.3)}
  .cat-pill.home{color:#C8D880;border:1px solid rgba(200,216,128,0.3)}
  .cat-pill.hand{color:#D4A860;border:1px solid rgba(212,168,96,0.3)}
  .card-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:3px}
  .card-nombre{font-family:"Cormorant",serif;font-size:13px;font-weight:400;line-height:1.2;color:var(--white)}
  .card-tipo{font-size:7.5px;letter-spacing:1px;color:var(--gray);font-weight:200}
  .card-notas{font-size:7.5px;color:var(--lgray);letter-spacing:0.5px;margin-top:2px}
  .card-prices{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .price-usd{font-size:8px;color:var(--gray)}
  .price-usd strong{display:block;font-size:13px;font-weight:300;color:var(--cyan)}
  .price-ars{font-size:8px;color:var(--gray);text-align:right}
  .price-ars strong{display:block;font-size:13px;font-weight:300;color:var(--rose)}
  .card-link{font-size:8px;color:var(--lgray);letter-spacing:1px;text-decoration:none;margin-top:4px;display:inline-block}
  .card-link:hover{color:var(--cyan)}
  .add-btn{width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--gray);font-family:"Raleway",sans-serif;font-size:8px;letter-spacing:2px;cursor:pointer;transition:all .2s}
  .add-btn.added{background:rgba(136,200,216,0.08);border-color:var(--cyan);color:var(--cyan)}

  /* CART DRAWER */
  .cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;backdrop-filter:blur(4px)}
  .cart-overlay.open{display:block}
  .cart-drawer{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:80vh;display:flex;flex-direction:column}
  .cart-drawer.open{transform:translateY(0)}
  .drawer-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
  .drawer-header{padding:14px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .drawer-title{font-family:"Cormorant",serif;font-size:18px;font-weight:300;letter-spacing:3px}
  .drawer-close{background:var(--card2);border:1px solid var(--border);color:var(--gray);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
  .drawer-items{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px}
  .cart-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px}
  .cart-item-icon{width:34px;height:34px;background:var(--card2);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cart-item-icon svg{width:18px;height:18px;opacity:0.5}
  .cart-item-info{flex:1}
  .cart-item-name{font-family:"Cormorant",serif;font-size:13px;font-weight:400}
  .cart-item-tipo{font-size:7.5px;color:var(--gray);letter-spacing:1px}
  .cart-item-price{font-size:10px;color:var(--cyan);margin-top:2px}
  .cart-item-remove{background:none;border:none;color:var(--lgray);font-size:16px;cursor:pointer;padding:4px;line-height:1}
  .drawer-empty{text-align:center;padding:32px;color:var(--lgray);font-size:11px;letter-spacing:2px}
  .drawer-footer{padding:14px 20px 24px;border-top:1px solid var(--border)}
  .cart-total{display:flex;justify-content:space-between;margin-bottom:14px;font-size:11px}
  .cart-total span{color:var(--gray);letter-spacing:2px}
  .cart-total strong{color:var(--white);font-size:16px;font-weight:300}
  .wa-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--cyan),var(--rose));color:#080808;border:none;border-radius:10px;font-family:"Raleway",sans-serif;font-size:10px;font-weight:400;letter-spacing:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .15s}
  .wa-btn:active{transform:scale(0.98)}
  .wa-btn:disabled{opacity:0.3;cursor:not-allowed}
  .wa-note{text-align:center;font-size:7.5px;color:var(--lgray);letter-spacing:1px;margin-top:8px}

  footer{padding:20px 16px;border-top:1px solid var(--border);text-align:center}
  footer p{font-size:8px;color:var(--lgray);letter-spacing:2px;margin-bottom:3px}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--cyan);color:var(--cyan);padding:7px 18px;border-radius:20px;font-size:9px;letter-spacing:2px;opacity:0;transition:all .3s;z-index:300;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  <button class="filter-tab" data-cat="HAND CARE" onclick="filterCat('HAND CARE',this)">HAND CARE</button>
</div>

<div class="products" id="productsGrid"></div>

<footer>
  <p>@CARRYCLUB · USA → ARGENTINA</p>
  <p>M U C H O &nbsp; A N T E S .</p>
</footer>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <span class="drawer-title">Tu Pedido</span>
    <button class="drawer-close" onclick="toggleCart()">×</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-footer">
    <div class="cart-total">
      <span>TOTAL ESTIMADO</span>
      <strong id="cartTotal">USD 0</strong>
    </div>
    <button class="wa-btn" id="waBtn" onclick="sendToWhatsApp()" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
      ENVIAR PEDIDO POR WHATSAPP
    </button>
    <p class="wa-note">Te confirmaremos disponibilidad y forma de pago</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WA_NUMBER = '5491100000000';
const TC = 1250, MARGEN = 1.20;

const icons = {
  "HOME":`<svg viewBox="0 0 40 40" fill="none"><rect x="15" y="12" width="10" height="18" rx="1" stroke="#C8D880" stroke-width="1.2" fill="rgba(200,216,128,0.08)"/><ellipse cx="20" cy="10" rx="2" ry="3" stroke="#FFD044" stroke-width="1" fill="rgba(255,208,68,0.2)"/><line x1="20" y1="7" x2="20" y2="5" stroke="#FFD044" stroke-width="1"/></svg>`,
  "FRAGRANCE":`<svg viewBox="0 0 40 40" fill="none"><rect x="14" y="16" width="9" height="13" rx="2" stroke="#C86890" stroke-width="1.2" fill="rgba(200,104,144,0.08)"/><rect x="16" y="13" width="5" height="4" rx="1" stroke="#C86890" stroke-width="1" fill="rgba(200,104,144,0.15)"/><line x1="21" y1="16" x2="24" y2="16" stroke="#C86890" stroke-width="1"/><line x1="24" y1="14" x2="24" y2="18" stroke="#C86890" stroke-width="1"/></svg>`,
  "HAND CARE":`<svg viewBox="0 0 40 40" fill="none"><rect x="14" y="15" width="9" height="16" rx="2" stroke="#D4A860" stroke-width="1.2" fill="rgba(212,168,96,0.08)"/><rect x="16" y="12" width="5" height="4" rx="1" stroke="#D4A860" stroke-width="1" fill="rgba(212,168,96,0.15)"/><line x1="16" y1="22" x2="23" y2="22" stroke="#D4A860" stroke-width="0.8" opacity="0.5"/><line x1="16" y1="25" x2="23" y2="25" stroke="#D4A860" stroke-width="0.8" opacity="0.5"/></svg>`,
  "BODY CARE":`<svg viewBox="0 0 40 40" fill="none"><rect x="13" y="12" width="11" height="18" rx="2" stroke="#88C8D8" stroke-width="1.2" fill="rgba(136,200,216,0.08)"/><rect x="15" y="9" width="7" height="4" rx="1" stroke="#88C8D8" stroke-width="1" fill="rgba(136,200,216,0.15)"/><line x1="15" y1="19" x2="22" y2="19" stroke="#88C8D8" stroke-width="0.8" opacity="0.5"/><line x1="15" y1="22" x2="22" y2="22" stroke="#88C8D8" stroke-width="0.8" opacity="0.5"/></svg>`
};

const catClass = {"BODY CARE":"body","FRAGRANCE":"frag","HOME":"home","HAND CARE":"hand"};

const productos = [
  {id:1,nombre:"Japanese Cherry Blossom",tipo:"Body Lotion",notas:"Cherry Blossom · Pear · Jasmine",precio_usd:14.95,cat:"BODY CARE",url:"https://www.bathandbodyworks.com/p/japanese-cherry-blossom-body-lotion-028019062"},
  {id:2,nombre:"Lemon Vanilla",tipo:"3-Wick Candle",notas:"Lemon · Vanilla · Summer Sun",precio_usd:24.95,cat:"HOME",url:"https://www.bathandbodyworks.com/p/lemon-vanilla-3-wick-candle-028029467"},
  {id:3,nombre:"Into The Night",tipo:"Fine Fragrance Mist",notas:"Dark Berries · Jasmine · Sandalwood",precio_usd:17.95,cat:"FRAGRANCE",url:"https://www.bathandbodyworks.com/p/into-the-night-fine-fragrance-mist-026531783"},
  {id:4,nombre:"Eucalyptus Spearmint",tipo:"Shower Gel",notas:"Eucalyptus · Spearmint · Aloe",precio_usd:14.95,cat:"BODY CARE",url:"https://www.bathandbodyworks.com/p/eucalyptus-spearmint-body-wash-026188860"},
  {id:5,nombre:"Mahogany Teakwood",tipo:"3-Wick Candle",notas:"Mahogany · Teakwood · Dark Oak",precio_usd:24.95,cat:"HOME",url:"https://www.bathandbodyworks.com/p/mahogany-teakwood-3-wick-candle-028001654"},
  {id:6,nombre:"Strawberry Pound Cake",tipo:"Foaming Hand Soap",notas:"Strawberry · Vanilla · Cream",precio_usd:8.95,cat:"HAND CARE",url:"https://www.bathandbodyworks.com/p/strawberry-pound-cake-foaming-hand-soap-026188854"},
  {id:7,nombre:"A Thousand Wishes",tipo:"Body Cream",notas:"Champagne · Almond · Sandalwood",precio_usd:16.95,cat:"BODY CARE",url:"https://www.bathandbodyworks.com/p/a-thousand-wishes-body-butter-026191171"},
  {id:8,nombre:"Mahogany Teakwood",tipo:"Wallflower Refills x2",notas:"Mahogany · Teakwood · Lavender",precio_usd:12.95,cat:"HOME",url:"https://www.bathandbodyworks.com/p/mahogany-teakwood-wallflowers-fragrance-refills-2-pack-026188873"},
];

let cart=[];

function formatARS(usd){const v=usd*TC*MARGEN;return v>=1000?`$${(v/1000).toFixed(0)}k`:`$${v.toFixed(0)}`}

function renderProducts(filter='ALL'){
  const grid=document.getElementById('productsGrid');
  grid.innerHTML='';
  productos.forEach(p=>{
    const inCart=cart.includes(p.id);
    const hidden=filter!=='ALL'&&p.cat!==filter;
    const card=document.createElement('div');
    card.className=`product-card${inCart?' in-cart':''}${hidden?' hidden':''}`;
    card.id=`card-${p.id}`;
    card.innerHTML=`
      <div class="card-top-line"></div>
      <div class="card-img">
        ${icons[p.cat]||''}
        <span class="cat-pill ${catClass[p.cat]}">${p.cat}</span>
      </div>
      <div class="card-body">
        <div class="card-nombre">${p.nombre}</div>
        <div class="card-tipo">${p.tipo}</div>
        <div class="card-notas">${p.notas}</div>
        <div class="card-prices">
          <div class="price-usd">USA<strong>USD ${p.precio_usd.toFixed(0)}</strong></div>
          <div class="price-ars">BsAs<strong>${formatARS(p.precio_usd)}</strong></div>
        </div>
        <a class="card-link" href="${p.url}" target="_blank">→ ver en BBW</a>
        <button class="add-btn ${inCart?'added':''}" onclick="toggleItem(${p.id})">
          ${inCart?'✓ AGREGADO':'+ AGREGAR'}
        </button>
      </div>`;
    grid.appendChild(card);
  });
}

function toggleItem(id){
  const idx=cart.indexOf(id);
  if(idx===-1){cart.push(id);showToast('Agregado al pedido')}
  else cart.splice(idx,1);
  updateCartUI();
  const inCart=cart.includes(id);
  const card=document.getElementById(`card-${id}`);
  card.classList.toggle('in-cart',inCart);
  card.querySelector('.add-btn').className=`add-btn ${inCart?'added':''}`;
  card.querySelector('.add-btn').textContent=inCart?'✓ AGREGADO':'+ AGREGAR';
}

function updateCartUI(){
  const count=cart.length;
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cartCount').classList.toggle('visible',count>0);
  document.querySelector('.cart-btn').classList.toggle('has-items',count>0);
  const total=cart.reduce((s,id)=>s+productos.find(x=>x.id===id).precio_usd,0);
  document.getElementById('cartTotal').textContent=`USD ${total.toFixed(2)}`;
  const items=document.getElementById('drawerItems');
  if(!cart.length){items.innerHTML='<div class="drawer-empty">TU PEDIDO ESTÁ VACÍO</div>';}
  else{items.innerHTML=cart.map(id=>{
    const p=productos.find(x=>x.id===id);
    return `<div class="cart-item">
      <div class="cart-item-icon">${icons[p.cat]}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${p.nombre}</div>
        <div class="cart-item-tipo">${p.tipo}</div>
        <div class="cart-item-price">USD ${p.precio_usd.toFixed(2)} · ${formatARS(p.precio_usd)}</div>
      </div>
      <button class="cart-item-remove" onclick="toggleItem(${p.id})">×</button>
    </div>`;
  }).join('');}
  document.getElementById('waBtn').disabled=!cart.length;
}

function toggleCart(){
  document.getElementById('cartOverlay').classList.toggle('open');
  document.getElementById('cartDrawer').classList.toggle('open');
}

function sendToWhatsApp(){
  if(!cart.length)return;
  const items=cart.map(id=>{const p=productos.find(x=>x.id===id);return `• ${p.nombre} ${p.tipo} — USD ${p.precio_usd.toFixed(2)}`;
  });
  const total=cart.reduce((s,id)=>s+productos.find(x=>x.id===id).precio_usd,0);
  const msg=`Hola Carry Club! 👋 Quiero pedir del DROP #001 Bath & Body Works:\n\n${items.join('\n')}\n\nTotal estimado: USD ${total.toFixed(2)}\n\n¡Gracias!`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
}

function filterCat(cat,btn){
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderProducts(cat);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

renderProducts();updateCartUI();
</script>
</body>
</html>
