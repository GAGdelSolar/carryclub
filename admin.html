<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carry Club · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&family=Raleway:wght@200;300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#080808;--white:#EDE9E3;--gray:#666;--lgray:#2a2a2a;
  --cyan:#88C8D8;--rose:#C86890;--gold:#e8b84b;--border:#161616;
  --green:#4caf50;--red:#f44336;
}
body{background:var(--black);color:var(--white);font-family:'Raleway',sans-serif;font-weight:300;min-height:100vh}

/* ── NAV ── */
nav{
  background:#0a0a0a;border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.nav-logo{font-family:'Cormorant',serif;font-size:18px;letter-spacing:5px;color:var(--white)}
.nav-badge{font-size:7px;letter-spacing:3px;color:var(--gold);border:0.5px solid var(--gold);padding:3px 8px;border-radius:2px}

/* ── AUTH PANEL ── */
#auth-panel{
  max-width:480px;margin:60px auto;padding:32px;
  background:#0d0d0d;border:0.5px solid var(--border);
}
.auth-title{font-family:'Cormorant',serif;font-size:28px;font-weight:300;letter-spacing:3px;margin-bottom:6px}
.auth-sub{font-size:8px;letter-spacing:2px;color:var(--lgray);margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:7px;letter-spacing:2px;color:var(--lgray)}
.field input{
  padding:10px 12px;background:#111;border:0.5px solid var(--lgray);
  color:var(--white);font-family:'Raleway',sans-serif;font-size:13px;outline:none;
  transition:border-color .2s;
}
.field input:focus{border-color:var(--cyan)}
.btn-primary{
  width:100%;padding:12px;background:var(--cyan);border:none;
  color:var(--black);font-size:8px;letter-spacing:4px;
  font-family:'Raleway',sans-serif;font-weight:700;cursor:pointer;
  transition:opacity .2s;
}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.4;cursor:default}
#auth-status{font-size:10px;margin-top:10px;min-height:16px;text-align:center}

/* ── MAIN PANEL ── */
#main-panel{display:none;padding:24px 20px;max-width:900px;margin:0 auto}

/* Status bar */
#status-bar{
  padding:10px 16px;margin-bottom:20px;font-size:10px;letter-spacing:1px;
  border-radius:3px;display:none;
}
#status-bar.ok{background:rgba(76,175,80,.1);border:0.5px solid var(--green);color:var(--green)}
#status-bar.err{background:rgba(244,67,54,.1);border:0.5px solid var(--red);color:var(--red)}
#status-bar.info{background:rgba(136,200,216,.08);border:0.5px solid var(--cyan);color:var(--cyan)}

/* Header acciones */
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.panel-title{font-family:'Cormorant',serif;font-size:26px;font-weight:300;letter-spacing:3px}
.header-actions{display:flex;gap:8px}
.btn-sm{
  padding:8px 16px;font-size:8px;letter-spacing:2px;font-family:'Raleway',sans-serif;
  cursor:pointer;border-radius:2px;font-weight:600;transition:opacity .2s;border:0.5px solid;
}
.btn-sm:hover{opacity:.75}
.btn-sm:disabled{opacity:.35;cursor:default}
.btn-outline-cyan{background:transparent;border-color:var(--cyan);color:var(--cyan)}
.btn-outline-gold{background:transparent;border-color:var(--gold);color:var(--gold)}
.btn-outline-red{background:transparent;border-color:var(--red);color:var(--red)}
.btn-solid-cyan{background:var(--cyan);border-color:var(--cyan);color:var(--black)}
.btn-solid-rose{background:var(--rose);border-color:var(--rose);color:#fff}

/* Drop cards */
.drops-list{display:flex;flex-direction:column;gap:1px}

.drop-card{
  background:#0d0d0d;border:0.5px solid var(--border);
  overflow:hidden;transition:border-color .2s;
}
.drop-card:hover{border-color:var(--lgray)}
.drop-card.expired{opacity:.5}

.drop-card-header{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  cursor:pointer;
}
.dc-num{
  font-family:'Cormorant',serif;font-size:22px;font-weight:300;
  color:var(--lgray);flex-shrink:0;width:52px;text-align:center;
  border:0.5px solid var(--lgray);padding:4px;
}
.drop-card.active-drop .dc-num{color:var(--cyan);border-color:var(--cyan)}
.drop-card.expired .dc-num{color:var(--red);border-color:var(--red)}

.dc-info{flex:1}
.dc-marca{font-family:'Cormorant',serif;font-size:18px;font-weight:300;letter-spacing:2px;color:var(--white);margin-bottom:3px}
.dc-meta{font-size:8px;letter-spacing:1px;color:var(--lgray);display:flex;gap:12px;flex-wrap:wrap}
.dc-meta span{display:flex;align-items:center;gap:4px}
.meta-cyan{color:var(--cyan)}
.meta-rose{color:var(--rose)}
.meta-green{color:var(--green)}
.meta-red{color:var(--red)}

.dc-badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.badge{font-size:6px;letter-spacing:2px;padding:3px 8px;border:0.5px solid}
.badge-activo{border-color:var(--green);color:var(--green)}
.badge-inactivo{border-color:var(--lgray);color:var(--lgray)}
.badge-vencido{border-color:var(--red);color:var(--red)}

.dc-toggle{color:var(--lgray);font-size:14px;flex-shrink:0;transition:transform .2s}
.drop-card.open .dc-toggle{transform:rotate(180deg)}

/* Drop edit form */
.drop-edit{
  display:none;padding:20px 18px;border-top:0.5px solid var(--border);
  background:#0a0a0a;
}
.drop-card.open .drop-edit{display:block}

.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(min-width:600px){.edit-grid{grid-template-columns:repeat(3,1fr)}}
.edit-field{display:flex;flex-direction:column;gap:5px}
.edit-field.full{grid-column:1/-1}
.edit-field label{font-size:7px;letter-spacing:2px;color:var(--lgray)}
.edit-inp{
  padding:8px 10px;background:#111;border:0.5px solid var(--lgray);
  color:var(--white);font-family:'Raleway',sans-serif;font-size:12px;outline:none;
  transition:border-color .2s;width:100%;
}
.edit-inp:focus{border-color:var(--cyan)}
.edit-inp.inp-gold{color:var(--gold);font-weight:700}
.edit-inp.inp-rose{color:var(--rose)}

/* Toggle activo/inactivo */
.toggle-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.toggle-label{font-size:8px;letter-spacing:2px;color:var(--lgray)}
.toggle-switch{
  position:relative;width:40px;height:22px;flex-shrink:0;
}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{
  position:absolute;inset:0;background:var(--lgray);
  border-radius:11px;cursor:pointer;transition:background .2s;
}
.toggle-slider::before{
  content:'';position:absolute;width:16px;height:16px;
  background:#fff;border-radius:50%;top:3px;left:3px;
  transition:transform .2s;
}
.toggle-switch input:checked + .toggle-slider{background:var(--cyan)}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px)}

.edit-actions{display:flex;gap:8px;margin-top:6px}

/* Sección nueva entrada */
#new-drop-section{
  margin-top:32px;border-top:0.5px solid var(--border);padding-top:24px;
}
.section-title{font-size:8px;letter-spacing:3px;color:var(--lgray);margin-bottom:16px}

/* Loading spinner */
.spin{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(136,200,216,.2);border-top-color:var(--cyan);
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty state */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--lgray);
}
.empty-state .sym{font-family:'Cormorant',serif;font-size:48px;opacity:.1;display:block;margin-bottom:12px}
.empty-state p{font-size:9px;letter-spacing:3px}
</style>
</head>
<body>

<nav>
  <a href="index.html" style="text-decoration:none">
    <span class="nav-logo">CARRY CLUB</span>
  </a>
  <span class="nav-badge">⚙ ADMIN</span>
</nav>

<!-- AUTH -->
<div id="auth-panel">
  <div class="auth-title">Admin</div>
  <div class="auth-sub">GESTIÓN DE DROPS · CATALOG.JSON</div>

  <div class="field">
    <label>GITHUB TOKEN (ghp_...)</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
  </div>
  <div class="field">
    <label>REPO (owner/repo)</label>
    <input type="text" id="gh-repo" value="GAGdelSolar/carryclub">
  </div>
  <div class="field">
    <label>BRANCH</label>
    <input type="text" id="gh-branch" value="main">
  </div>

  <button class="btn-primary" id="btn-login">CONECTAR →</button>
  <div id="auth-status"></div>
</div>

<!-- MAIN PANEL -->
<div id="main-panel">
  <div id="status-bar"></div>

  <div class="panel-header">
    <div class="panel-title">Drops</div>
    <div class="header-actions">
      <button class="btn-sm btn-outline-cyan" id="btn-reload">↺ Recargar</button>
      <button class="btn-sm btn-outline-gold" id="btn-add-toggle">+ Nuevo drop</button>
      <button class="btn-sm btn-outline-red" id="btn-logout" style="margin-left:8px">Desconectar</button>
    </div>
  </div>

  <div id="drops-list" class="drops-list">
    <div class="empty-state">
      <span class="spin"></span>
      <p style="margin-top:12px">Cargando catalog.json…</p>
    </div>
  </div>

  <!-- NUEVO DROP -->
  <div id="new-drop-section" style="display:none">
    <div class="section-title">NUEVA ENTRADA EN CATALOG.JSON</div>
    <div class="edit-grid">
      <div class="edit-field">
        <label>Nº DROP</label>
        <input class="edit-inp inp-gold" type="number" id="new-num" placeholder="8" min="1">
      </div>
      <div class="edit-field">
        <label>MARCA</label>
        <input class="edit-inp" type="text" id="new-marca" placeholder="TOMMY HILFIGER">
      </div>
      <div class="edit-field">
        <label>DESCRIPCIÓN</label>
        <input class="edit-inp" type="text" id="new-desc" placeholder="WOMEN'S SALE · USA">
      </div>
      <div class="edit-field">
        <label>DEADLINE (datetime-local)</label>
        <input class="edit-inp inp-rose" type="datetime-local" id="new-deadline">
      </div>
      <div class="edit-field">
        <label>PRODUCTOS (cantidad)</label>
        <input class="edit-inp" type="number" id="new-prods" placeholder="9" min="0">
      </div>
      <div class="edit-field">
        <label>PRECIO DESDE (ARS)</label>
        <input class="edit-inp" type="number" id="new-precio" placeholder="120000" min="0">
      </div>
      <div class="edit-field full">
        <label>URL HTML DEL DROP (relativa a la raíz)</label>
        <input class="edit-inp" type="text" id="new-url" placeholder="drops/drop008.html">
      </div>
      <div class="edit-field full">
        <label>SUFIJO / PARTE (opcional, para drops en partes — ej: "PARTE A")</label>
        <input class="edit-inp" type="text" id="new-sufijo" placeholder="PARTE A">
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-sm btn-solid-cyan" id="btn-new-save">AGREGAR AL CATALOG →</button>
      <button class="btn-sm btn-outline-red" id="btn-new-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────
let GH_TOKEN  = '';
let GH_OWNER  = '';
let GH_REPO   = '';
let GH_BRANCH = 'main';
let CATALOG   = [];
let CATALOG_SHA = null;

const CATALOG_PATH = 'drops/catalog.json';

// ── AUTH ──────────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', async () => {
  const token  = document.getElementById('gh-token').value.trim();
  const repoParts = document.getElementById('gh-repo').value.trim().split('/');
  GH_BRANCH = document.getElementById('gh-branch').value.trim() || 'main';

  if (!token || repoParts.length < 2) {
    setAuthStatus('Completá todos los campos', 'err'); return;
  }

  GH_TOKEN = token;
  GH_OWNER = repoParts[0];
  GH_REPO  = repoParts[1];

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Verificando…';
  setAuthStatus('', '');

  try {
    await ghGet('');  // Verificar acceso al repo
    setAuthStatus('', '');
    document.getElementById('auth-panel').style.display = 'none';
    document.getElementById('main-panel').style.display = 'block';
    await loadCatalog();
  } catch(e) {
    setAuthStatus('✗ ' + e.message, 'err');
  }
  btn.disabled = false;
  btn.textContent = 'CONECTAR →';
});

document.getElementById('btn-logout').addEventListener('click', () => {
  GH_TOKEN = GH_OWNER = GH_REPO = '';
  CATALOG = []; CATALOG_SHA = null;
  document.getElementById('main-panel').style.display = 'none';
  document.getElementById('auth-panel').style.display = 'block';
  document.getElementById('gh-token').value = '';
});

function setAuthStatus(msg, type) {
  const el = document.getElementById('auth-status');
  el.textContent = msg;
  el.style.color = type === 'err' ? '#f44336' : type === 'ok' ? '#4caf50' : '#888';
}

// ── GITHUB API ────────────────────────────────────────────
function ghHeaders() {
  return {
    'Authorization': 'Bearer ' + GH_TOKEN,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
}

async function ghGet(path) {
  const url = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + (path ? '/contents/' + path : '');
  const r = await fetch(url + '?ref=' + GH_BRANCH, { headers: ghHeaders() });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.message || 'HTTP ' + r.status);
  }
  return r.json();
}

// Encoding UTF-8 robusto: TextEncoder → bytes → base64
// btoa() nativo solo soporta latin-1 y rompe con tildes si el HTML tiene acentos.
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

async function ghPut(path, content, message, sha) {
  const body = {
    message,
    content: toBase64(content),   // UTF-8 seguro, sin romper tildes
    branch: GH_BRANCH,
  };
  if (sha) body.sha = sha;
  const r = await fetch(
    'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + path,
    { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) }
  );
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.message || 'HTTP ' + r.status);
  }
  return r.json();
}

// ── LOAD CATALOG ──────────────────────────────────────────
async function loadCatalog() {
  setStatus('Cargando catalog.json…', 'info');
  try {
    const data = await ghGet(CATALOG_PATH);
    CATALOG_SHA = data.sha;
    CATALOG = JSON.parse(atob(data.content.replace(/\n/g, '')));
    CATALOG.sort((a, b) => (b.num || 0) - (a.num || 0));
    setStatus('✓ ' + CATALOG.length + ' drops cargados', 'ok');
    renderDrops();
  } catch(e) {
    setStatus('✗ Error al leer catalog.json: ' + e.message, 'err');
    renderDrops();
  }
}

// ── SAVE CATALOG ──────────────────────────────────────────
async function saveCatalog(commitMsg) {
  const content = JSON.stringify(CATALOG, null, 2);
  const result  = await ghPut(CATALOG_PATH, content, commitMsg, CATALOG_SHA);
  // Actualizar SHA para el próximo save
  CATALOG_SHA = result.content && result.content.sha;
  return result;
}

// ── STATUS BAR ────────────────────────────────────────────
function setStatus(msg, type) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = type;
  bar.style.display = msg ? 'block' : 'none';
  if (type === 'ok') {
    setTimeout(() => { if (bar.textContent === msg) bar.style.display = 'none'; }, 4000);
  }
}

// ── RENDER DROPS ──────────────────────────────────────────
function isExpired(drop) {
  return new Date(drop.deadline) <= new Date();
}

function renderDrops() {
  const container = document.getElementById('drops-list');

  if (CATALOG.length === 0) {
    container.innerHTML = '<div class="empty-state"><span class="sym">∅</span><p>Sin drops en el catalog</p></div>';
    return;
  }

  container.innerHTML = CATALOG.map((drop, idx) => {
    const expired = isExpired(drop);
    const dropClasses = [
      'drop-card',
      !expired && drop.activo ? 'active-drop' : '',
      expired ? 'expired' : '',
    ].filter(Boolean).join(' ');

    const badgeHTML = expired
      ? '<span class="badge badge-vencido">VENCIDO</span>'
      : drop.activo
        ? '<span class="badge badge-activo">ACTIVO</span>'
        : '<span class="badge badge-inactivo">INACTIVO</span>';

    const deadlineFormatted = drop.deadline
      ? new Date(drop.deadline).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : '—';

    // Tiempo restante o "VENCIDO"
    const now  = new Date();
    const dead = new Date(drop.deadline);
    const diff = dead - now;
    let timeStr = 'VENCIDO';
    if (diff > 0) {
      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      timeStr = days > 0 ? days + 'd ' + hours + 'h restantes' : hours + 'h restantes';
    }

    // Input datetime-local value
    const deadlineLocal = drop.deadline
      ? new Date(drop.deadline).toISOString().slice(0, 16)
      : '';

    return `
    <div class="${dropClasses}" id="dcard-${idx}">
      <div class="drop-card-header" onclick="toggleCard(${idx})">
        <div class="dc-num">#${String(drop.num || '?').padStart(3,'0')}</div>
        <div class="dc-info">
          <div class="dc-marca">${drop.marca || '—'}</div>
          <div class="dc-meta">
            <span class="${expired ? 'meta-red' : 'meta-cyan'}">${timeStr}</span>
            <span>${drop.productos || 0} productos</span>
            ${drop.precio_desde ? '<span>Desde $' + Math.round(drop.precio_desde).toLocaleString('es-AR') + '</span>' : ''}
            <span style="color:var(--lgray);font-size:7px">${deadlineFormatted}</span>
          </div>
        </div>
        <div class="dc-badges">${badgeHTML}</div>
        <span class="dc-toggle">▾</span>
      </div>

      <div class="drop-edit">
        <!-- Toggle activo -->
        <div class="toggle-wrap">
          <label class="toggle-switch">
            <input type="checkbox" id="tog-activo-${idx}" ${drop.activo ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-label" id="tog-label-${idx}">${drop.activo ? 'ACTIVO' : 'INACTIVO'}</span>
        </div>

        <div class="edit-grid">
          <div class="edit-field">
            <label>Nº DROP</label>
            <input class="edit-inp inp-gold" type="number" id="e-num-${idx}" value="${drop.num || ''}" min="1">
          </div>
          <div class="edit-field">
            <label>MARCA</label>
            <input class="edit-inp" type="text" id="e-marca-${idx}" value="${escHtml(drop.marca || '')}">
          </div>
          <div class="edit-field">
            <label>DESCRIPCIÓN</label>
            <input class="edit-inp" type="text" id="e-desc-${idx}" value="${escHtml(drop.descripcion || '')}">
          </div>
          <div class="edit-field">
            <label>DEADLINE</label>
            <input class="edit-inp inp-rose" type="datetime-local" id="e-deadline-${idx}" value="${deadlineLocal}">
          </div>
          <div class="edit-field">
            <label>PRODUCTOS</label>
            <input class="edit-inp" type="number" id="e-prods-${idx}" value="${drop.productos || 0}" min="0">
          </div>
          <div class="edit-field">
            <label>PRECIO DESDE (ARS)</label>
            <input class="edit-inp" type="number" id="e-precio-${idx}" value="${drop.precio_desde || 0}" min="0">
          </div>
          <div class="edit-field full">
            <label>URL HTML</label>
            <input class="edit-inp" type="text" id="e-url-${idx}" value="${escHtml(drop.url || '')}">
          </div>
          <div class="edit-field full">
            <label>WA NUMBER</label>
            <input class="edit-inp" type="text" id="e-wa-${idx}" value="${escHtml(drop.wa || '5491130211626')}">
          </div>
        </div>

        <div class="edit-actions">
          <button class="btn-sm btn-solid-cyan" onclick="saveDropEdit(${idx})" id="save-btn-${idx}">GUARDAR CAMBIOS →</button>
          <button class="btn-sm btn-outline-red"
            onclick="confirmDeleteDrop(${idx})"
            style="margin-left:auto"
          >ELIMINAR ESTE DROP</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Bind toggle listeners
  CATALOG.forEach((_, idx) => {
    const tog = document.getElementById('tog-activo-' + idx);
    if (tog) {
      tog.addEventListener('change', function() {
        const label = document.getElementById('tog-label-' + idx);
        if (label) label.textContent = this.checked ? 'ACTIVO' : 'INACTIVO';
      });
    }
  });
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleCard(idx) {
  const card = document.getElementById('dcard-' + idx);
  if (card) card.classList.toggle('open');
}

// ── GUARDAR CAMBIOS DE UN DROP ────────────────────────────
async function saveDropEdit(idx) {
  const btn = document.getElementById('save-btn-' + idx);
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Guardando…';

  try {
    const deadlineInput = document.getElementById('e-deadline-' + idx).value;
    const deadlineISO   = deadlineInput ? new Date(deadlineInput).toISOString().replace('Z', '-03:00') : CATALOG[idx].deadline;

    const activo = document.getElementById('tog-activo-' + idx).checked;
    const num    = parseInt(document.getElementById('e-num-' + idx).value) || CATALOG[idx].num;

    CATALOG[idx] = Object.assign({}, CATALOG[idx], {
      num,
      id:          'drop' + String(num).padStart(3,'0'),
      marca:       document.getElementById('e-marca-' + idx).value.trim(),
      descripcion: document.getElementById('e-desc-' + idx).value.trim(),
      deadline:    deadlineISO,
      productos:   parseInt(document.getElementById('e-prods-' + idx).value) || 0,
      precio_desde:parseFloat(document.getElementById('e-precio-' + idx).value) || 0,
      url:         document.getElementById('e-url-' + idx).value.trim(),
      wa:          document.getElementById('e-wa-' + idx).value.trim() || '5491130211626',
      activo,
    });

    // Reordenar
    CATALOG.sort((a, b) => (b.num || 0) - (a.num || 0));

    await saveCatalog('Admin: editar drop #' + String(num).padStart(3,'0') + ' ' + (CATALOG.find(d=>d.num===num)||{}).marca);
    setStatus('✓ Drop actualizado y catalog.json pusheado a GitHub', 'ok');
    renderDrops();
  } catch(e) {
    setStatus('✗ Error al guardar: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'GUARDAR CAMBIOS →';
  }
}

// ── ELIMINAR DROP ─────────────────────────────────────────
function confirmDeleteDrop(idx) {
  const drop = CATALOG[idx];
  const numStr = String(drop.num || '?').padStart(3,'0');
  const msg = '¿Eliminar Drop #' + numStr + ' — ' + drop.marca + '?\n\nEsto borra la entrada del catalog.json pero NO borra el archivo HTML del drop.\n\nEscribí "confirmar" para continuar:';
  const input = prompt(msg);
  if (!input || input.toLowerCase().trim() !== 'confirmar') {
    if (input !== null) alert('Escribiste "' + input + '" — no coincide. Cancelado.');
    return;
  }
  deleteDrop(idx, drop);
}

async function deleteDrop(idx, drop) {
  const numStr = String(drop.num || '?').padStart(3,'0');
  setStatus('Eliminando drop #' + numStr + '…', 'info');
  try {
    CATALOG.splice(idx, 1);
    await saveCatalog('Admin: eliminar drop #' + numStr + ' ' + drop.marca);
    setStatus('✓ Drop #' + numStr + ' eliminado del catalog.json', 'ok');
    renderDrops();
  } catch(e) {
    // Revertir
    CATALOG.splice(idx, 0, drop);
    setStatus('✗ Error al eliminar: ' + e.message, 'err');
  }
}

// ── NUEVO DROP ────────────────────────────────────────────
document.getElementById('btn-add-toggle').addEventListener('click', () => {
  const sec = document.getElementById('new-drop-section');
  const isOpen = sec.style.display !== 'none';
  sec.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    // Sugerir número siguiente
    const maxNum = CATALOG.reduce((m, d) => Math.max(m, d.num || 0), 0);
    document.getElementById('new-num').value = maxNum + 1;
    const numStr = String(maxNum + 1).padStart(3, '0');
    document.getElementById('new-url').value = 'drops/drop' + numStr + '.html';
    // Scroll
    sec.scrollIntoView({ behavior: 'smooth' });
  }
});

document.getElementById('btn-new-cancel').addEventListener('click', () => {
  document.getElementById('new-drop-section').style.display = 'none';
});

document.getElementById('new-num').addEventListener('input', function() {
  const n = parseInt(this.value) || '';
  if (n) {
    const numStr = String(n).padStart(3,'0');
    document.getElementById('new-url').value = 'drops/drop' + numStr + '.html';
  }
});

document.getElementById('btn-new-save').addEventListener('click', async () => {
  const num         = parseInt(document.getElementById('new-num').value);
  const marca       = document.getElementById('new-marca').value.trim();
  const desc        = document.getElementById('new-desc').value.trim();
  const deadlineRaw = document.getElementById('new-deadline').value;
  const prods       = parseInt(document.getElementById('new-prods').value) || 0;
  const precio      = parseFloat(document.getElementById('new-precio').value) || 0;
  const url         = document.getElementById('new-url').value.trim();
  const sufijo      = document.getElementById('new-sufijo').value.trim();

  if (!num || !marca || !deadlineRaw) {
    setStatus('✗ Completá: número, marca y deadline', 'err'); return;
  }

  // Check duplicado
  if (CATALOG.find(d => d.num === num && !sufijo)) {
    const ok = confirm('Ya existe un Drop #' + num + '. ¿Agregar igual? (Usá el sufijo para diferenciarlo, ej: "PARTE B")');
    if (!ok) return;
  }

  const deadlineISO = new Date(deadlineRaw).toISOString().replace('Z', '-03:00');
  const numStr      = String(num).padStart(3, '0');
  const id          = sufijo
    ? 'drop' + numStr + '-' + sufijo.toLowerCase().replace(/\s+/g,'-')
    : 'drop' + numStr;
  const marcaFull   = sufijo ? marca + ' · ' + sufijo : marca;

  const btn = document.getElementById('btn-new-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Creando…';

  try {
    const newEntry = {
      id,
      num,
      marca: marcaFull,
      descripcion: desc || "WOMEN'S SALE · USA",
      deadline: deadlineISO,
      activo: true,
      wa: '5491130211626',
      url: url || ('drops/' + id + '.html'),
      productos: prods,
      precio_desde: precio,
      subdrops: [],
      creado: new Date().toISOString(),
    };

    CATALOG.push(newEntry);
    CATALOG.sort((a, b) => (b.num || 0) - (a.num || 0));

    await saveCatalog('Admin: agregar drop #' + numStr + ' ' + marcaFull);
    setStatus('✓ Drop #' + numStr + ' agregado al catalog.json', 'ok');
    renderDrops();
    document.getElementById('new-drop-section').style.display = 'none';

    // Limpiar form
    ['new-num','new-marca','new-desc','new-deadline','new-prods','new-precio','new-url','new-sufijo']
      .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  } catch(e) {
    setStatus('✗ Error: ' + e.message, 'err');
  }

  btn.disabled = false;
  btn.textContent = 'AGREGAR AL CATALOG →';
});

// ── RELOAD ────────────────────────────────────────────────
document.getElementById('btn-reload').addEventListener('click', () => loadCatalog());
</script>
