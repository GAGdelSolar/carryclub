# ── Carry Club · netlify.toml ────────────────────────────────────────────────

# Fuerza headers correctos para todos los HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/drops/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# catalog.json: sin caché agresiva para que los cambios se vean rápido
[[headers]]
  for = "/drops/catalog.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# JS y CSS: caché larga
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
